# Static SPA server. Serves the built assets and falls back to index.html so
# client-side routes (React Router) resolve on hard refresh / deep links.
server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Long-cache fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy: the app is built with VITE_API_BASE_URL=/api and calls /api/* on
    # its own origin, so nginx forwards those to the backend service on the shared
    # network. Same-origin => no CORS. The backend host defaults to `backend:8080`
    # (override by naming the service `backend` on the compose/run network; the
    # local dev stack uses `mp-backend`).
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }

    # SPA fallback: any unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
