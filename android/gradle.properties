# JVM args for the Gradle daemon. Phase B pulls in the CometChat Chat/UIKit +
# Calls SDKs; Jetifier has to rewrite their heavy transitive deps, so 2g OOMs
# mid-build — 4g + a larger metaspace is the validated floor.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# The CometChat Chat SDK still ships legacy com.android.support:* transitively;
# Jetifier rewrites those to androidx.* so they don't collide with androidx.core.
android.enableJetifier=true

kotlin.code.style=official
